name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run format:check
      - run: pip install ruff==0.16.8
      - run: ruff check backend scripts workers/python
      - run: ruff format --check backend scripts workers/python
      - run: npm audit --audit-level=high

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and test every implementation
        run: docker build -t workbench:ci .
      - name: Start application with test-only access tokens
        run: |
          docker run -d --name workbench -p 127.0.0.1:4173:4173 \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m --cpus 1 \
            -e WORKBENCH_TOKEN=ci-only-token-not-for-deployment \
            -e READ_ONLY_TOKEN=ci-only-viewer-token-not-for-deployment \
            -v workbench-ci-data:/app/.data workbench:ci
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/api/health && exit 0
            sleep 1
          done
          docker logs workbench
          exit 1
      - name: Browser workflow and accessibility tests
        run: npm run test:e2e
      - name: Save diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container logs
        if: always()
        run: docker logs workbench || true
